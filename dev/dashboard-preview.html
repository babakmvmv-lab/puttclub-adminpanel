<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08110f">
  <title>پیش‌نمایش پوستهٔ پنل — پات‌کلاب</title>
  <link rel="preload" href="/assets/fonts/vazirmatn-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/vazirmatn-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="is-dashboard">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="پوستهٔ منوی مدیریت">
      <div class="sidebar-brand"><span class="brand-emblem small" aria-hidden="true"><span></span></span><div><b>پنل مدیریت</b><small>PUTT CLUB · ADMIN</small></div></div>
      <div class="sidebar-divider"></div>
      <div class="menu-caption">منوی مدیریت</div>
      <nav class="sidebar-menu" aria-label="منوی مدیریت"><!-- آیتم‌ها در این منوی سمت راست قرار می‌گیرند؛ فعلاً خالی است. --></nav>
      <div class="sidebar-bottom"><div class="sidebar-account"><span class="online-dot" aria-hidden="true"></span><span class="manager-label">مدیر</span></div><button class="logout-btn" type="button"><span aria-hidden="true">↪</span><b>خروج</b></button></div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="بازکردن منو" aria-expanded="false"><span></span><span></span><span></span></button>
        <div class="topbar-center" aria-label="تاریخ شمسی و ساعت تهران">
          <div class="date-chip" aria-label="تاریخ شمسی"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M7.5 3.5v3M16.5 3.5v3M4 9h16M8 12.5h.01M12 12.5h.01M16 12.5h.01M8 16.5h.01M12 16.5h.01"/></svg></span><b id="tehranDate">—</b></div>
          <div class="clock-chip" aria-label="ساعت تهران"><span class="chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2.5h6M12 2.5v2.5"/></svg></span><b id="tehranTime">—</b></div>
        </div>
      </header>
      <section class="workspace" aria-label="فضای خالی پنل مدیریت"></section>
      <footer class="workspace-footer"><span>PUTT CLUB</span><span>TEHRAN · IRAN</span></footer>
    </main>
    <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="بستن منو"></button>
  </div>
  <script>
    const dateFmt = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'Asia/Tehran',day:'numeric',month:'long',year:'numeric'});
    const timeFmt = new Intl.DateTimeFormat('fa-IR',{timeZone:'Asia/Tehran',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
    function tick(){const now=new Date();document.querySelector('#tehranDate').textContent=dateFmt.format(now);document.querySelector('#tehranTime').textContent=timeFmt.format(now)}
    tick();setInterval(tick,1000);
    const shell=document.querySelector('.app-shell');
    const toggle=document.querySelector('#menuToggle');
    const backdrop=document.querySelector('#sidebarBackdrop');
    toggle.addEventListener('click',()=>{const open=shell.classList.toggle('nav-open');toggle.setAttribute('aria-expanded',String(open))});
    backdrop.addEventListener('click',()=>{shell.classList.remove('nav-open');toggle.setAttribute('aria-expanded','false')});
  </script>
</body>
</html>
